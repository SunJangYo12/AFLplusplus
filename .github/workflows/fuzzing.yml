name: Fuzz PHP (AFL++, gaya Magma)

# Meniru targets/php dan fuzzers/afl dari Magma v1.2.1:
#  - harness bawaan php-src (sapi/fuzzer): unserialize, json, exif, parser
#  - build dengan --enable-fuzzer, engine = driver AFL (persistent loop)
#  - setup.patch milik Magma (menangani ifunc yang crash di build AFL)
#  - seed corpus dari generate_*.php milik php-src
# Bedanya dengan Magma: tanpa canary/bug injection, dan ASAN aktif untuk mencari bug nyata.

on:
  push:
    branches: [v4.32c-fuzzing-inci-php-magma]
  pull_request:
    branches: [v4.32c-fuzzing-inci-php-magma]

  workflow_dispatch:
    inputs:
      minutes:
        description: "Durasi fuzzing per driver (menit, maks ~300)"
        default: "60"
  schedule:
    - cron: "0 20 * * 0"

env:
  MAGMA_TAG: v1.2.1
  # commit yang sama dengan magma/targets/php/fetch.sh
  PHP_COMMIT: bc39abe8c3c492e29bc5d60ca58442040bbf063b
  FUZZ_MINUTES: ${{ github.event.inputs.minutes || '60' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: aflplusplus/aflplusplus:latest
    timeout-minutes: 90
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make autoconf automake \
            libtool bison re2c pkg-config libonig-dev patch

      - name: Fetch php-src (commit Magma) dan setup.patch Magma
        run: |
          git clone --no-checkout https://github.com/php/php-src.git php-src
          git -C php-src checkout "$PHP_COMMIT"
          git clone --depth 1 --branch "$MAGMA_TAG" https://github.com/HexHive/magma.git magma
          patch -p1 -d php-src < magma/targets/php/patches/setup/setup.patch

      - name: Cari driver AFL++
        id: drv
        run: |
          D=$(find / -name libAFLDriver.a 2>/dev/null | head -1)
          [ -n "$D" ] || { echo "::error::libAFLDriver.a tidak ditemukan"; exit 1; }
          echo "path=$D" >> "$GITHUB_OUTPUT"

      - name: Configure + build (afl-clang-fast + ASAN)
        working-directory: php-src
        env:
          AFL_USE_ASAN: "1"
          AFL_LLVM_INSTRUMENT: "CLASSIC"
        run: |
          export CC=afl-clang-fast CXX=afl-clang-fast++
          # sama seperti Magma: object-size sanitizer tidak cocok dengan union zend_function
          export EXTRA_CFLAGS="-O1 -g -fno-sanitize=object-size"
          export EXTRA_CXXFLAGS="$EXTRA_CFLAGS"
          ./buildconf --force
          LIB_FUZZING_ENGINE="${{ steps.drv.outputs.path }}" ./configure \
            --disable-all --enable-option-checking=fatal \
            --enable-fuzzer --enable-exif --enable-phar --enable-mbstring \
            --without-pcre-jit --disable-phpdbg --disable-cgi --with-pic
          make -j"$(nproc)"
          ls -l sapi/fuzzer/php-fuzz-* sapi/cli/php

      - name: Generate seed corpora (sama dengan build.sh Magma)
        working-directory: php-src
        run: |
          # php CLI hasil build ber-ASAN; leak tidak relevan untuk generator
          export ASAN_OPTIONS=detect_leaks=0 USE_ZEND_ALLOC=0
          sapi/cli/php sapi/fuzzer/generate_unserialize_dict.php
          sapi/cli/php sapi/fuzzer/generate_parser_corpus.php
          for d in unserialize json exif parser; do
            mkdir -p "sapi/fuzzer/corpus/$d"
            [ -n "$(ls -A sapi/fuzzer/corpus/$d)" ] || printf 'a' > "sapi/fuzzer/corpus/$d/seed"
          done

      - name: Package
        run: |
          mkdir -p pkg/corpus
          for d in unserialize json exif parser; do
            cp php-src/sapi/fuzzer/php-fuzz-$d pkg/$d
            cp -r php-src/sapi/fuzzer/corpus/$d pkg/corpus/$d
          done
          # dictionary untuk unserialize jika ada
          cp php-src/sapi/fuzzer/dict/unserialize pkg/unserialize.dict 2>/dev/null || true
          tar czf pkg.tgz pkg

      - uses: actions/upload-artifact@v4
        with:
          name: php-fuzzers
          path: pkg.tgz

  fuzz:
    needs: build
    runs-on: ubuntu-latest
    container: aflplusplus/aflplusplus:latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        driver: [unserialize, json, exif, parser]
    steps:
      - name: Runtime deps
        run: apt-get update && apt-get install -y --no-install-recommends libonig5

      - uses: actions/download-artifact@v4
        with:
          name: php-fuzzers

      - name: Unpack
        run: tar xzf pkg.tgz

      - name: Restore corpus dari run sebelumnya
        uses: actions/cache@v4
        with:
          path: carry/${{ matrix.driver }}
          key: php-${{ matrix.driver }}-corpus-${{ github.run_id }}
          restore-keys: php-${{ matrix.driver }}-corpus-

      - name: afl-fuzz
        env:
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          AFL_NO_AFFINITY: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          USE_ZEND_ALLOC: "0"
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:symbolize=0
        run: |
          D=${{ matrix.driver }}
          mkdir -p "carry/$D" out
          if [ -n "$(ls -A carry/$D 2>/dev/null)" ]; then IN="carry/$D"; else IN="pkg/corpus/$D"; fi
          DICT=""; [ "$D" = unserialize ] && [ -f pkg/unserialize.dict ] && DICT="-x pkg/unserialize.dict"
          SECS=$(( FUZZ_MINUTES * 60 ))
          N=$(nproc)
          afl-fuzz -i "$IN" -o out -M main -V "$SECS" -m none $DICT -- "pkg/$D" > main.log 2>&1 &
          for i in $(seq 1 $((N-1))); do
            afl-fuzz -i "$IN" -o out -S "s$i" -V "$SECS" -m none $DICT -- "pkg/$D" > "s$i.log" 2>&1 &
          done
          wait || true
          afl-whatsup -s out || true

      - name: Simpan corpus
        if: always()
        run: |
          mkdir -p "carry/${{ matrix.driver }}"
          cp out/main/queue/id* "carry/${{ matrix.driver }}/" 2>/dev/null || true

      - name: Ringkas crash
        if: always()
        run: |
          echo "## ${{ matrix.driver }}" >> "$GITHUB_STEP_SUMMARY"
          echo "crash: $(ls out/*/crashes/id* 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "hang:  $(ls out/*/hangs/id* 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-${{ matrix.driver }}
          path: |
            out/*/crashes
            out/*/hangs
            out/*/fuzzer_stats
            out/*/plot_data
            *.log
          if-no-files-found: ignore
