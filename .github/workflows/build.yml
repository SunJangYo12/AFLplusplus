name: Fuzzing fridamode-libjpeg

# STOP: gh workflow disable "Fuzzing fridamode-libjpeg"
# gh run cancel 38494535088 --force
# START:
# gh workflow list --all        # lihat status: active / disabled_manually
# gh workflow enable "Fuzzing fridamode-libjpeg"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Durasi fuzzing per sesi"
        default: "1m"
  push:
    branches: [v4.32c-fuzzing-inci]
    paths:
      - ".github/workflows/build.yml"
      - "frida_mode/test/jpeg/**"
  schedule:
    - cron: "0 */6 * * *"   # opsional, jaring pengaman kalau rantai putus

concurrency:
  group: fuzz-loop
  cancel-in-progress: false # jangan batalkan jika masih run, misal saat commit baru maka dimasukan ke queue

permissions:
  contents: read
  actions: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # paksa berhenti sebelum 6 jam

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev automake cmake git flex bison libglib2.0-dev libpixman-1-dev python3-setuptools cargo libgtk-3-dev
          sudo apt-get install -y lld-14 llvm-14 llvm-14-dev clang-14 || sudo apt-get install -y lld llvm llvm-dev clang
          sudo apt-get install -y gcc-$(gcc --version|head -n1|sed 's/\..*//'|sed 's/.* //')-plugin-dev libstdc++-$(gcc --version|head -n1|sed 's/\..*//'|sed 's/.* //')-dev
          sudo apt-get install -y ninja-build cpio libcapstone-dev wget curl python3-pip

      - name: Ambil hasil sesi sebelumnya
        continue-on-error: true # abaikan error, tetap lanjut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list -w "${{ github.workflow }}" -s success -L 1 \
                   --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n fuzz-state -D prev
            mkdir -p ~/frida-out-prev
            tar xzf prev/state.tar.gz -C ~/frida-out-prev
          fi

      - name: Running AFL++
        run: |
          cd frida_mode/test/jpeg/build
          tar xf result.tar.gz     # build bawaan repo (jangan tertukar dengan hasil fuzzing)
          cd ..

          # lanjutkan dari output sesi sebelumnya kalau ada
          if [ -d ~/frida-out-prev/frida-out ]; then
            cp -R ~/frida-out-prev/frida-out build/frida-out
            export AFL_AUTORESUME=1
          fi

          timeout -s INT -k 2m "${{ inputs.duration || '1m' }}" \
            bash run.sh > ~/mylog.txt 2>&1 || true

          pkill -9 -f build/test || true
          pkill -9 afl-fuzz || true
          cp -R build/frida-out ~ || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p output
          cp ~/mylog.txt output/ || true
          cp -R ~/frida-out output || true
          tar czf state.tar.gz -C output .

      - name: Upload artifact
        if: always() # pelindung data alias tetap upload walau error
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-state
          path: state.tar.gz
          retention-days: 7

      - name: Lanjutkan sesi berikutnya
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref ${{ github.ref_name }}
