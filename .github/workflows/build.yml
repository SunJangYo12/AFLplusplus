name: Fuzzing fridamode-libjpeg

on:
  push:
    branches: [v4.32c-fuzzing-inci]
  pull_request:
    branches: [v4.32c-fuzzing-inci]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Running AFL++
        run: |
           set -o pipefail

           {
              cd frida_mode/test/jpeg
              bash run.sh || true
              cp -R build/frida-out ~

           } 2>&1 | tee -a ~/mylog.txt

      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/
          cp -R ~/frida-out output

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
