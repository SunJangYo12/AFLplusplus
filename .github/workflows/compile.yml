name: Build PHP fuzzers (AFL++)

# Build sekali di dalam container ubuntu:24.04, simpan di GitHub Release.
# Workflow "Fuzz PHP" mengambil binary dari sini.
# Jalankan ulang hanya jika PHP_COMMIT / flag build berubah.

on:
  push:
    branches: [v4.32c-fuzzing-inci-php-magma]
  workflow_dispatch: # gh workflow run compile.yml --ref v4.32c-fuzzing-inci-php-magma

permissions:
  contents: write   # wajib untuk membuat release

env:
  MAGMA_TAG: v1.2.1
  PHP_COMMIT: bc39abe8c3c492e29bc5d60ca58442040bbf063b   # sama dengan magma/targets/php/fetch.sh
  RELEASE_TAG: php-fuzzers-latest
  AFLPP_REF: v4.21c          # tag AFL++ yang di-pin
  IMAGE: ubuntu:20.04        # di-pin supaya sama dengan job fuzz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Build PHP fuzzers di container
        run: |
          mkdir -p out

          docker run --rm -v "$PWD:/work" -w /work \
            -e MAGMA_TAG="$MAGMA_TAG" \
            -e PHP_COMMIT="$PHP_COMMIT" \
            -e AFLPP_REF="$AFLPP_REF" \
            "$IMAGE" bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential git ca-certificates clang llvm llvm-dev lld \
              make autoconf automake libtool bison re2c pkg-config libonig-dev patch \
              libc++-dev \
              libc++abi-dev

            export AFLPP_PREFIX=/opt/aflpp

            echo "=========== build AFL++ ================"
            git clone --depth 1 --branch "$AFLPP_REF" https://github.com/AFLplusplus/AFLplusplus.git aflpp-src
            (cd aflpp-src && make source-only -j"$(nproc)" && make install PREFIX="$AFLPP_PREFIX")
            export PATH="$AFLPP_PREFIX/bin:$PATH"
            afl-clang-fast --version

            DRV=$(find "$AFLPP_PREFIX" -name libAFLDriver.a | head -1)
            [ -n "$DRV" ] || { echo "libAFLDriver.a tidak terpasang oleh make install"; exit 1; }

            echo "=========== fetch php-src + setup.patch Magma ================"
            git clone --no-checkout https://github.com/php/php-src.git php-src
            git -C php-src checkout "$PHP_COMMIT"
            git clone --depth 1 --branch "$MAGMA_TAG" https://github.com/HexHive/magma.git magma
            patch -p1 -d php-src < magma/targets/php/patches/setup/setup.patch

            echo "=========== build PHP (afl-clang-fast + ASAN) ================"
            cd php-src
            export AFL_USE_ASAN=1
            export CC=afl-clang-fast CXX=afl-clang-fast++
            export EXTRA_CFLAGS="-O1 -g -fno-sanitize=object-size"
            export EXTRA_CXXFLAGS="$EXTRA_CFLAGS"
            ./buildconf --force
            LIB_FUZZING_ENGINE="$DRV" ./configure \
              --disable-all --enable-option-checking=fatal \
              --enable-fuzzer --enable-exif --enable-phar --enable-mbstring \
              --without-pcre-jit --disable-phpdbg --disable-cgi --with-pic
            make -j"$(nproc)"

            echo "=========== seed corpora ================"
            export ASAN_OPTIONS=detect_leaks=0 USE_ZEND_ALLOC=0
            sapi/cli/php sapi/fuzzer/generate_unserialize_dict.php
            sapi/cli/php sapi/fuzzer/generate_parser_corpus.php
            for d in unserialize json exif parser; do
              mkdir -p "sapi/fuzzer/corpus/$d"
              [ -n "$(ls -A sapi/fuzzer/corpus/$d)" ] || printf a > "sapi/fuzzer/corpus/$d/seed"
            done

            echo "=========== package ================"
            cd ..
            mkdir -p pkg/corpus pkg/bin
            for d in unserialize json exif parser; do
              cp php-src/sapi/fuzzer/php-fuzz-$d pkg/$d
              cp -r php-src/sapi/fuzzer/corpus/$d pkg/corpus/$d
            done
            cp php-src/sapi/fuzzer/dict/unserialize pkg/unserialize.dict 2>/dev/null || true
            # bawa afl-fuzz yang sama persis dengan yang dipakai saat build
            cp "$AFLPP_PREFIX/bin/afl-fuzz" "$AFLPP_PREFIX/bin/afl-whatsup" pkg/bin/
            ldd pkg/bin/afl-fuzz
            . /etc/os-release
            {
              echo "afl++ $AFLPP_REF"
              echo "php_commit $PHP_COMMIT"
              echo "runner $PRETTY_NAME"
            } > pkg/BUILD_INFO
            cat pkg/BUILD_INFO

            # copy result
            cp -R pkg out/
          '

      - name: Kompres
        run: |
          sudo chown -R "$USER" out
          tar czvf php-fuzzers.tgz -C out pkg
          cat out/pkg/BUILD_INFO

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PHP fuzzers
          prerelease: true
          files: |
            php-fuzzers.tgz
