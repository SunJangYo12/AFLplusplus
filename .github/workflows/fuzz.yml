name: Fuzz PHP

# Mengambil paket hasil compile.yml dari GitHub Release lalu menjalankan afl-fuzz
# di dalam container ubuntu:24.04 (sama dengan container build), satu job per target.

on:
  workflow_dispatch: # gh workflow run fuzz.yml --ref v4.32c-fuzzing-inci-php-magma
    inputs:
      minutes:
        description: "Durasi fuzzing per target (menit, maks 340/6jam)"
        default: "2"
      targets:
        description: "Target (JSON array)"
        default: '["unserialize","json","exif","parser"]'

permissions:
  contents: read

env:
  RELEASE_TAG: php-fuzzers-latest
  IMAGE: ubuntu:20.04        # harus sama dengan IMAGE di compile.yml

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy: # run 4 job pararel
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["unserialize","json","exif","parser"]') }}

    steps:
      - name: Download paket dari release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern php-fuzzers.tgz
          tar xzf php-fuzzers.tgz
          cat pkg/BUILD_INFO
          mkdir -p findings


      - name: Fuzzing ${{ matrix.target }} di container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e TARGET="${{ matrix.target }}" \
            -e MINUTES="${{ inputs.minutes || '60' }}" \
            "$IMAGE" bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libonig5 llvm libc++-dev libc++abi-dev

            export AFL_SKIP_CPUFREQ=1 AFL_NO_UI=1 AFL_AUTORESUME=1 AFL_IGNORE_PROBLEMS=1
            export USE_ZEND_ALLOC=0
            export ASAN_OPTIONS=abort_on_error=1:detect_leaks=0:symbolize=0:allocator_may_return_null=1:handle_segv=0:handle_sigbus=0:handle_abort=0:handle_sigfpe=0:handle_sigill=0

            chmod +x pkg/"$TARGET" pkg/bin/*
            ldd pkg/bin/afl-fuzz

            DICT=""
            if [ "$TARGET" = unserialize ] && [ -f pkg/unserialize.dict ]; then
              DICT="-x pkg/unserialize.dict"
            fi

            echo "=========== start fuzzing $TARGET ================"
            ./pkg/bin/afl-fuzz \
              -i "pkg/corpus/$TARGET" -o "findings/$TARGET" \
              -m none -t 2000 \
              -V "$((MINUTES * 60))" $DICT \
              -- "./pkg/$TARGET" \
              || true
            echo "=========== done fuzzing $TARGET ================"

            ./pkg/bin/afl-whatsup -s "findings/$TARGET" || true
            echo "crashes: $(ls findings/$TARGET/default/crashes 2>/dev/null | grep -vc README || true)"
            echo "hangs:   $(ls findings/$TARGET/default/hangs 2>/dev/null | grep -vc README || true)"
          '

      - name: Kompres
        if: always()
        run: |
          sudo chown -R "$USER" findings
          tar czvf findings-${{ matrix.target }}.tar.gz \
            --exclude='*/default/.synced' \
            -C findings .

      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.target }}
          path: findings-${{ matrix.target }}.tar.gz
          retention-days: 30
