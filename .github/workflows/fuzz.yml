name: Fuzz PHP

on:
  push:
    branches: [v4.32c-fuzzing-inci-php-magma]
    paths:
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Durasi fuzzing per target (detik)"
        default: "260" #"18000"        # 5 jam
      targets:
        description: "Target (JSON array)"
        default: '["unserialize","json","exif","parser"]'
      loop:
        description: "Lanjutkan otomatis setelah selesai (true/false)"
        default: "true"
      generation:
        description: "Nomor putaran (jangan diisi manual)"
        default: "1"

permissions:
  contents: read
  actions: write      # untuk memicu run berikutnya & membaca artifact

env:
  RELEASE_TAG: php-fuzzers-latest
  IMAGE: ubuntu:20.04
  SECONDS_DEFAULT: "260" #"18000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["unserialize","json","exif","parser"]') }}

    steps:
      - name: Download paket dari release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern php-fuzzers.tgz
          tar xzf php-fuzzers.tgz
          cat pkg/BUILD_INFO
          mkdir -p findings

      # ---- RESUME: ambil state dari run terakhir yang sukses/selesai ----
      - name: Restore state run sebelumnya
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # cari artifact "state-<target>" terbaru (belum expired)
          ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=state-${{ matrix.target }}&per_page=1" \
            --jq '.artifacts[0] | select(.expired==false) | .id')
          if [ -n "$ID" ]; then
            echo "Ketemu state artifact id=$ID, mengunduh..."
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > state.zip
            unzip -o state.zip
            mkdir -p findings
            tar xzf state-${{ matrix.target }}.tar.gz -C findings
            ls -la findings/${{ matrix.target }}/default 2>/dev/null | head
          else
            echo "Tidak ada state sebelumnya, mulai dari awal."
          fi

      - name: Fuzzing ${{ matrix.target }} di container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e TARGET="${{ matrix.target }}" \
            -e SECONDS="${{ inputs.seconds || env.SECONDS_DEFAULT }}" \
            "$IMAGE" bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libonig5 llvm libc++-dev libc++abi-dev

            export AFL_SKIP_CPUFREQ=1 AFL_NO_UI=1 AFL_AUTORESUME=1 AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1
            export USE_ZEND_ALLOC=0
            export ASAN_OPTIONS=abort_on_error=1:detect_leaks=0:symbolize=0:allocator_may_return_null=1:handle_segv=0:handle_sigbus=0:handle_abort=0:handle_sigfpe=0:handle_sigill=0

            chmod +x pkg/"$TARGET" pkg/bin/*

            DICT=""
            if [ "$TARGET" = unserialize ] && [ -f pkg/unserialize.dict ]; then
              DICT="-x pkg/unserialize.dict"
            fi



            NCPU=$(nproc)
            echo "Core tersedia: $NCPU"
            export AFL_FINAL_SYNC=1      # main melakukan sync terakhir sebelum berhenti

            echo "=========== start fuzzing $TARGET ($NCPU instance) ================"

            # secondary: s1 .. s(N-1), jalan di background
            for i in $(seq 1 $((NCPU-1))); do
              ./pkg/bin/afl-fuzz \
                -i "pkg/corpus/$TARGET" -o "findings/$TARGET" \
                -S "s$i" -m none -t 2000 \
                -V "$SECONDS" $DICT \
                -- "./pkg/$TARGET" >/dev/null 2>&1 &
            done

            # main di foreground
            ./pkg/bin/afl-fuzz \
              -i "pkg/corpus/$TARGET" -o "findings/$TARGET" \
              -M master -m none -t 2000 \
              -V "$SECONDS" $DICT \
              -- "./pkg/$TARGET" \
              || true

            wait   # tunggu semua secondary selesai
            echo "=========== done fuzzing $TARGET ================"

            ./pkg/bin/afl-whatsup -s "findings/$TARGET" || true
            echo "crashes: $(find findings/$TARGET -path "*/crashes/id:*" | wc -l)"
            echo "hangs:   $(find findings/$TARGET -path "*/hangs/id:*" | wc -l)"
          '


      - name: Ringkasan
        if: always()
        run: |
          T="${{ matrix.target }}"
          sudo chown -R "$USER" findings
          D="findings/$T"

          total() { cat $D/*/fuzzer_stats 2>/dev/null | awk -F' *: *' -v k="$1" '$1==k{s+=$2} END{printf "%d", s}'; }
          maxv()  { cat $D/*/fuzzer_stats 2>/dev/null | awk -F' *: *' -v k="$1" '$1==k && $2+0>m{m=$2+0} END{printf "%d", m}'; }

          PATHS=$(maxv corpus_count); [ "$PATHS" = 0 ] && PATHS=$(maxv paths_total)
          CRASH=$(find $D -path '*/crashes/id:*' 2>/dev/null | wc -l)
          HANGS=$(find $D -path '*/hangs/id:*' 2>/dev/null | wc -l)

          echo "--- debug ---"
          ls $D
          head -30 $D/*/fuzzer_stats 2>/dev/null | head -40

          {
            echo "• $T"
            echo "  instance: $(ls -d $D/*/ 2>/dev/null | wc -l)"
            echo "  exec/s: $(total execs_per_sec)"
            echo "  paths: $PATHS"
            echo "  crashes: $CRASH | hangs: $HANGS"
          } > "summary-$T.txt"
          cat "summary-$T.txt"

      - name: Upload ringkasan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.target }}
          path: summary-${{ matrix.target }}.txt
          retention-days: 1



      - name: Kompres
        if: always()
        run: |
          sudo chown -R "$USER" findings

          tar czf findings-${{ matrix.target }}.tar.gz \
            --exclude='.synced' \
            -C findings .

          # state untuk resume (nama file khusus)
          cp findings-${{ matrix.target }}.tar.gz state-${{ matrix.target }}.tar.gz


      - name: Upload hasil (arsip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.target }}-gen${{ inputs.generation || '1' }}
          path: findings-${{ matrix.target }}.tar.gz
          retention-days: 30

      - name: Upload state (untuk lanjut)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: state-${{ matrix.target }}.tar.gz
          retention-days: 7
          overwrite: true


  # Dijalankan setelah SEMUA target selesai -> picu putaran berikutnya
  next:
    needs: fuzz
    if: always() && (inputs.loop == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger putaran berikutnya
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GEN=$(( ${{ inputs.generation || 1 }} + 1 ))
          echo "Memicu generation $GEN"
          gh workflow run fuzz.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            -f seconds="${{ inputs.seconds || env.SECONDS_DEFAULT }}" \
            -f targets='${{ inputs.targets || '["unserialize","json","exif","parser"]' }}' \
            -f loop=true \
            -f generation="$GEN"

  report:
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          merge-multiple: true

      - name: Kirim ke Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          {
            echo "📊 Fuzz PHP - gen ${{ inputs.generation || 1 }}"
            echo "durasi: ${{ inputs.seconds || env.SECONDS_DEFAULT }} detik"
            echo "status job: ${{ needs.fuzz.result }}"
            echo
            cat summary-*.txt 2>/dev/null || echo "(ringkasan tidak ada)"
            #echo
            #echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > msg.txt
          curl -sS -m 30 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" --data-urlencode "text@msg.txt"
